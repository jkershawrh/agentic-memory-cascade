# Workload profiles with fingerprints for bootstrapper classification.
# Fingerprints use deepfield's actual signal types and resource kinds
# (OpenShift signals, not domain-specific business signals).
# The workload type determines which inference strategy and model
# assignments to use — the signals themselves are infrastructure signals
# that LOOK DIFFERENT depending on what the cluster is running.

fraud-triage:
  display_name: FSI Fraud Triage
  industry: fsi
  sla_latency_ms: 200
  fingerprint:
    namespace_patterns:
      - "fraud-*"
      - "fsi-fraud-*"
    signal_type_weights:
      alert_critical: 0.25
      splunk_high_alert: 0.20
      pod_crashloop: 0.15
      event_backoff: 0.10
      kserve_not_ready: 0.08
    resource_kind_weights:
      Pod: 0.50
      InferenceService: 0.20
      Route: 0.15
      Node: 0.10
    severity_distribution:
      critical: 0.08
      high: 0.20
      medium: 0.25
      low: 0.25
      info: 0.22
    failure_class_weights:
      pods_crashlooping: 0.30
      oom_killed: 0.15
      readiness_probe_failed: 0.10

