# Lever 4: Adaptive Caching — application-layer response cache
# "Identical or near-identical queries get instant responses"
# Triforce reference: modules/adaptive-classification/ — cold ~800ms, warm <5ms

lever: adaptive_cache
description: Application-level response cache for repeated queries

protocol:
  # Send the same query multiple times to measure cache warmup
  unique_queries: 100
  repetitions_per_query: 5
  # First hit = cold (model inference), subsequent = warm (cache hit)

# Simulated at the harness level — we track which queries repeat
# and measure the delta between first and subsequent responses
# In production, this would be an in-process cache (Redis, LRU, etc.)
simulation: true

measure: [warm_cache_speedup, cold_start_ms]
triforce_reference: "cold ~800ms, warm <5ms after 3 calls"
