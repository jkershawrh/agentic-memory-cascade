# Lever 1: Quantization — AMX-INT8 vs BF16
# "Same model, same runtime, different precision — how much does AMX buy you?"

lever: quantization
description: AMX-INT8 quantized models vs bfloat16 baseline on OVMS

pairs:
  - optimized: granite-2b-int8
    baseline: granite-2b-cpu
    dtype_optimized: int8
    dtype_baseline: bfloat16
    backend: ovms

target_speedup: 1.5  # Triforce claim threshold
measure: [throughput_tok_s, latency_p95_ms, quality_preservation]
