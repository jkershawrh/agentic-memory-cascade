# Lever 6: Semantic Routing + Cascade
# "85% of signals never touch a model — the cascade IS the TCO story"

lever: routing
description: Cascade-filtered workload vs flat processing

protocol:
  # Apply signal distribution from workload profile before inference:
  #   nano (routine) → skip inference entirely ($0)
  #   micro (ambiguous) → small model (granite-2b)
  #   macro (complex) → larger model (phi3-mini or granite-8b)
  #
  # Compare effective throughput and cost vs sending ALL signals to one model
  cascade_mode: true
  flat_mode: true

# Uses workload signal_distribution to split the corpus
# Then measures total wall-clock time and cost for each mode
measure: [throughput_tok_s, workflow_e2e_ms]
