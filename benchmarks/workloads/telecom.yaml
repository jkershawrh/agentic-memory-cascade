# Telecom Industry Workloads

industry: telecom
description: Network operations — ticket routing, anomaly detection, churn prediction

tasks:
  - id: ticket-routing
    name: Support Ticket Routing
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, granite-350m, granite-4.1-3b]
    max_tokens: 64
    tokens_estimate: {input: 120, output: 30}
    prompt: |
      Route this customer support ticket. Return JSON with: category (billing/technical/service_change/complaint/outage/equipment), priority (p1_critical/p2_high/p3_medium/p4_low), department (noc/billing/retention/field_ops/tier2_support), estimated_resolution_hours.

      {ticket}
    quality_check: structured_json
    quality_target: category
    sample_input: "Customer reports complete loss of internet and phone service since 6:30 AM. Modem shows no signal lights. Neighbors on same street also affected. Customer is a business account (dental office) — states they cannot process patient records or take card payments. Account #BIZ-2026-44521."

  - id: network-anomaly
    name: Network Log Anomaly Detection
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, qwen25-3b-cpu, granite-4.1-3b]
    max_tokens: 200
    tokens_estimate: {input: 200, output: 80}
    prompt: |
      Analyze this network log excerpt for anomalies. Return JSON with: anomaly_detected (true/false), anomaly_type (traffic_spike/packet_loss/latency_degradation/auth_failure/config_drift/none), severity (info/warning/critical), affected_systems (array), root_cause_hypothesis, recommended_action.

      {log_excerpt}
    quality_check: structured_json
    quality_target: anomaly_detected
    sample_input: "2026-07-28 03:12:44 [WARN] BGP peer 10.0.1.1 flap count: 47 in last 300s (threshold: 5). 2026-07-28 03:12:45 [ERR] Interface ge-0/0/3 CRC errors: 1,247/min (baseline: <10/min). 2026-07-28 03:12:46 [WARN] Packet loss on trunk-east: 4.2% (SLA: <0.1%). 2026-07-28 03:12:47 [INFO] Traffic volume normal. CPU utilization: 23%."

  - id: churn-prediction
    name: Customer Churn Risk Scoring
    cascade_tier: macro
    model_assignments: [phi3-mini-cpu, granite-3-2-8b-instruct-cpu, granite-4.1-8b]
    max_tokens: 200
    tokens_estimate: {input: 250, output: 80}
    prompt: |
      Assess churn risk for this telecom customer. Return JSON with: churn_risk (low/medium/high/critical), churn_probability_pct (0-100), risk_factors (array), retention_actions (array of recommended interventions), estimated_lifetime_value_impact.

      {customer_profile}
    quality_check: structured_json
    quality_target: churn_risk
    sample_input: "Customer 18 months into 24-month contract. Plan: Unlimited Premium ($85/mo). Usage trend: data usage dropped 60% over 3 months. Called support 4 times in last 30 days (billing disputes). Visited competitor store (T-Mobile, geo-tracked via app). NPS score dropped from 8 to 3. Payment: on-time but switched from auto-pay to manual. Family plan: 3 lines, 2 are minimal usage (likely kids left home)."

workflow:
  name: Network Operations Pipeline
  steps:
    - task: ticket-routing
      tier: micro
    - task: network-anomaly
      tier: micro
    - task: churn-prediction
      tier: macro
