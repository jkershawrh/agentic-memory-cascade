# Healthcare Industry Workloads
# Source: internal benchmark suite + healthcare-agent/benchmark.py

industry: healthcare
description: Clinical document processing — classification, entity extraction, summarization

tasks:
  - id: clinical-classification
    name: Clinical Document Classification
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, qwen25-3b-cpu, granite-4.1-3b]
    max_tokens: 32
    tokens_estimate: {input: 80, output: 10}
    prompt: |
      Classify this clinical document into exactly one category: discharge_summary, progress_note, lab_report, radiology_report. Respond with only the category name.

      {document}
    quality_check: exact_match
    quality_target: discharge_summary
    sample_input: "DISCHARGE SUMMARY: 72-year-old male with Type 2 Diabetes on Metformin 500mg and Lisinopril 10mg. Recent STEMI with PCI to RCA."

  - id: medical-ner
    name: Medical Entity Extraction
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, qwen25-3b-cpu, granite-3-2-8b-instruct-cpu]
    max_tokens: 512
    tokens_estimate: {input: 120, output: 200}
    prompt: |
      Extract all medical entities from this text as a JSON array. Each entity: {text, type (medication/condition/procedure)}. Respond with ONLY the JSON array.

      {document}
    quality_check: substring
    quality_target: Metformin
    sample_input: "72-year-old male with Type 2 Diabetes on Metformin 500mg and Lisinopril 10mg. Recent STEMI with PCI to RCA. Aspirin 81mg and Clopidogrel 75mg."

  - id: clinical-summarization
    name: Clinical Record Summarization
    cascade_tier: macro
    model_assignments: [phi3-mini-cpu, granite-3-2-8b-instruct-cpu, granite-4.1-8b]
    max_tokens: 256
    tokens_estimate: {input: 300, output: 100}
    prompt: |
      Summarize this clinical record in 2-3 sentences for a physician handoff. Be concise and include key findings.

      {document}
    quality_check: length_and_content
    quality_target: null
    sample_input: "72-year-old male admitted with acute chest pain. History of Type 2 Diabetes, hypertension, CKD stage 3. ECG showed ST elevation. Troponin I elevated at 8.2. Emergent catheterization revealed 95% occlusion of RCA. Successful PCI with drug-eluting stent."

workflow:
  name: Clinical Document Pipeline
  steps:
    - task: clinical-classification
      tier: micro
    - task: medical-ner
      tier: micro
    - task: clinical-summarization
      tier: macro
