# Basic Model Serving Benchmarks — ALL deployed models
# OVMS baseline + INT8 + llama.cpp GGUF + BitNet + SmolLM2

industry: basic
description: Raw model serving benchmarks — all deployed models

tasks:
  - id: classify-short
    name: Short Classification (32 token output)
    cascade_tier: micro
    model_assignments:
      - granite-350m
      - granite-4-0-h-tiny-cpu
      - granite-2b-cpu
      - granite-2b-int8
      - granite-2b-q4
      - granite-2b-q8
      - granite-8b-q4
      - qwen25-3b-cpu
      - granite-4.1-3b
      - phi3-mini-cpu
      - granite-3-2-8b-instruct-cpu
      - granite-4.1-8b
      - bitnet-2b
      - smollm2-360m
    max_tokens: 32
    tokens_estimate: {input: 50, output: 10}
    prompt: |
      Classify this text into exactly one category: positive, negative, neutral. Respond with only the category.

      {document}
    quality_check: exact_match
    quality_target: positive
    sample_input: "The new product launch exceeded all expectations with record sales and customer satisfaction scores."

  - id: extract-medium
    name: Entity Extraction (128 token output)
    cascade_tier: micro
    model_assignments:
      - granite-350m
      - granite-4-0-h-tiny-cpu
      - granite-2b-cpu
      - granite-2b-int8
      - granite-2b-q4
      - granite-2b-q8
      - granite-8b-q4
      - qwen25-3b-cpu
      - granite-4.1-3b
      - phi3-mini-cpu
      - granite-3-2-8b-instruct-cpu
      - granite-4.1-8b
      - bitnet-2b
      - smollm2-360m
    max_tokens: 128
    tokens_estimate: {input: 80, output: 60}
    prompt: |
      Extract all named entities from this text as a JSON array. Each entity: {text, type (person/org/location/date)}. Respond with only the JSON.

      {document}
    quality_check: substring
    quality_target: John
    sample_input: "John Smith met with Sarah Chen at the Google office in Mountain View on January 15th to discuss the Q4 results."

  - id: summarize-long
    name: Summarization (256 token output)
    cascade_tier: macro
    model_assignments:
      - granite-2b-cpu
      - granite-2b-int8
      - granite-2b-q4
      - granite-2b-q8
      - granite-8b-q4
      - qwen25-3b-cpu
      - granite-4.1-3b
      - phi3-mini-cpu
      - granite-3-2-8b-instruct-cpu
      - granite-4.1-8b
      - bitnet-2b
      - smollm2-360m
    max_tokens: 256
    tokens_estimate: {input: 200, output: 100}
    prompt: |
      Summarize the following text in 2-3 sentences.

      {document}
    quality_check: length_and_content
    quality_target: null
    sample_input: "The Federal Reserve held interest rates steady at its July meeting, signaling that while inflation has moderated from its 2022 peak, it remains above the 2% target. Chair Powell noted that the labor market continues to show resilience with unemployment at 3.7%, though wage growth has begun to cool. The committee emphasized it will continue to assess incoming data before making any changes to monetary policy, with markets now pricing in potential rate cuts beginning in the first quarter of next year."

  - id: generate-qa
    name: Question Answering (64 token output)
    cascade_tier: micro
    model_assignments:
      - granite-350m
      - granite-4-0-h-tiny-cpu
      - granite-2b-cpu
      - granite-2b-int8
      - granite-2b-q4
      - granite-2b-q8
      - granite-8b-q4
      - qwen25-3b-cpu
      - granite-4.1-3b
      - phi3-mini-cpu
      - granite-3-2-8b-instruct-cpu
      - granite-4.1-8b
      - bitnet-2b
      - smollm2-360m
    max_tokens: 64
    tokens_estimate: {input: 60, output: 30}
    prompt: |
      Answer this question in one sentence.

      {document}
    quality_check: length_and_content
    quality_target: null
    sample_input: "What is the capital of France?"
