# Financial Services Industry Workloads
# Source: internal benchmark rubric + TCO calculator workload_profiles.json

industry: fsi
description: Transaction processing — fraud detection, disputes, compliance, loan intake

tasks:
  - id: fraud-scoring
    name: Fraud Transaction Scoring
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, qwen25-3b-cpu, granite-4.1-3b]
    max_tokens: 200
    tokens_estimate: {input: 80, output: 50}
    prompt: |
      Analyze this transaction for fraud risk. Return a JSON object with: risk_score (0-100), risk_level (low/medium/high/critical), signals (array of suspicious indicators).

      {transaction}
    quality_check: structured_json
    quality_target: risk_score
    sample_input: "Transaction: $4,500 wire transfer from personal checking to offshore account in Cayman Islands. Customer profile: 28yo, avg monthly balance $3,200, no prior international transfers. Time: 2:47 AM local. Device: new mobile device, VPN detected."

  - id: dispute-classification
    name: Dispute Resolution Classification
    cascade_tier: micro
    model_assignments: [granite-2b-cpu, granite-350m, granite-4.1-3b]
    max_tokens: 64
    tokens_estimate: {input: 150, output: 20}
    prompt: |
      Classify this customer dispute into exactly one category: unauthorized_charge, billing_error, service_not_received, product_defect, duplicate_charge, other. Also indicate priority: routine, elevated, urgent. Respond as JSON: {category, priority, reason}.

      {dispute}
    quality_check: structured_json
    quality_target: category
    sample_input: "Customer reports charge of $89.99 from 'AMZN Digital' on 2026-07-15. Customer states they did not make this purchase and does not recognize the merchant. Card was in their possession. No recent travel."

  - id: compliance-screening
    name: AML Compliance Screening
    cascade_tier: macro
    model_assignments: [phi3-mini-cpu, granite-3-2-8b-instruct-cpu, granite-4.1-8b]
    max_tokens: 200
    tokens_estimate: {input: 300, output: 50}
    prompt: |
      A customer in Germany transfers $9,500 to a business account in the Cayman Islands. They have made 3 similar transfers in the past month, each just under $10,000. Does this pattern indicate potential structuring under AML regulations? Answer yes or no and explain in 2 sentences.

      {transaction_details}
    quality_check: substring
    quality_target: null
    sample_input: "Additional context: Customer is a 45-year-old import/export business owner. Account opened 6 months ago. Three prior transfers: $9,200, $9,800, $9,100 — all to the same recipient in Grand Cayman."

  - id: loan-document-extraction
    name: Loan Document Field Extraction
    cascade_tier: micro
    model_assignments: [qwen25-3b-cpu, granite-2b-cpu, granite-4.1-3b]
    max_tokens: 300
    tokens_estimate: {input: 500, output: 100}
    prompt: |
      Extract key fields from this loan application. Return JSON with: applicant_name, loan_amount, loan_type (mortgage/auto/personal/business), employment_status, annual_income, credit_score_range, property_address (if applicable), missing_documents (array).

      {application}
    quality_check: structured_json
    quality_target: loan_amount
    sample_input: "APPLICATION FOR MORTGAGE LOAN. Applicant: Sarah Chen. Requested amount: $425,000. Property: 1847 Oak Drive, Austin TX 78704. Employment: Senior Software Engineer at TechCorp (3 years). Annual income: $165,000. Self-reported credit score: 740-760. Down payment: $85,000 (20%). Co-applicant: None. Missing: W-2 for 2025, property appraisal."

workflow:
  name: Transaction Processing Pipeline
  steps:
    - task: dispute-classification
      tier: micro
    - task: fraud-scoring
      tier: micro
    - task: compliance-screening
      tier: macro
