# Additional LiteLLM model entries for GGUF/llama.cpp models
# Apply by patching the litellm-config ConfigMap in triforce namespace
#
# Usage:
#   oc get cm litellm-config -n triforce -o yaml > /tmp/litellm-config.yaml
#   # Add these entries to model_list
#   oc apply -f /tmp/litellm-config.yaml
#   oc rollout restart deployment/litellm -n triforce

additional_models:
  - model_name: bitnet-2b
    litellm_params:
      model: openai/bitnet-2b4t
      api_base: http://bitnet-server.triforce.svc:8080/v1
      api_key: unused

  - model_name: smollm2-360m
    litellm_params:
      model: openai/smollm2-360m
      api_base: http://llama-smollm2-360m.triforce.svc:8080/v1
      api_key: unused

  - model_name: smollm2-1.7b
