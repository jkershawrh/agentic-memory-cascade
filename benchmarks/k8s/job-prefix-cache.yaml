apiVersion: batch/v1
kind: Job
metadata:
  name: bench-prefix-cache-single
  namespace: triforce
  labels:
    app: benchmark-harness
    bench-lever: prefix_cache
    bench-mode: single
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: benchmark-harness
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: harness
          image: image-registry.openshift-image-registry.svc:5000/triforce/tco-benchmark-harness:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LITELLM_API_BASE
              value: "http://litellm.triforce.svc:4000"
            - name: LITELLM_API_KEY
              value: "local-oberon-key"
            - name: BENCHMARK_RESULTS_DIR
              value: "/results"
          args:
            - "--mode=single"
            - "--lever=prefix_cache"
            - "--industries=all"
            - "--samples=30"
            - "--skip-preflight"
            - "--stream"
            - "--output=/results/benchmark-prefix-cache-single.json"
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "1"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
      restartPolicy: Never
