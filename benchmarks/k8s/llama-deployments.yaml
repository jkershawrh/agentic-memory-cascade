# llama-server Deployments for GGUF models on Oberon
# Each model gets a Deployment + Service, fronted by LiteLLM
# Models loaded from shared huggingface-model-cache PVC
---
# SmolLM2-360M Q8_0
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-smollm2-360m
  namespace: triforce
  labels:
    app: llama-server
    model: smollm2-360m
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-smollm2-360m
  template:
    metadata:
      labels:
        app: llama-smollm2-360m
        runtime: llama-cpp
    spec:
      containers:
        - name: llama
          image: ghcr.io/ggml-org/llama.cpp:server
          securityContext:
            allowPrivilegeEscalation: false
          args: ["--model", "/models/gguf/smollm2-360m/SmolLM2-360M-Instruct-Q8_0.gguf",
                 "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "2048",
                 "--threads", "4", "--alias", "smollm2-360m"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: models
              mountPath: /models
          resources:
            requests: {cpu: "2", memory: 1Gi}
            limits: {cpu: "4", memory: 2Gi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: huggingface-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: llama-smollm2-360m
  namespace: triforce
spec:
  selector:
    app: llama-smollm2-360m
  ports:
    - port: 8080
      targetPort: 8080
---
