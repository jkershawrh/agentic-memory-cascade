apiVersion: batch/v1
kind: Job
metadata:
  name: bench-agentic-fleet
  namespace: triforce
  labels:
    app: benchmark-harness
    bench-lever: agentic_fleet
    bench-mode: single
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app: benchmark-harness
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: harness
          image: image-registry.openshift-image-registry.svc:5000/triforce/tco-benchmark-harness:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: LITELLM_API_BASE
              value: "http://litellm.triforce.svc:4000"
            - name: LITELLM_API_KEY
              value: "local-oberon-key"
            - name: BENCHMARK_RESULTS_DIR
              value: "/results"
          command: ["python3", "-m", "benchmarks.fleet"]
          args:
            - "--pattern=all"
            - "--model=bitnet-2b"
            - "--agents=3,5,10"
            - "--samples=20"
            - "--output=/results/fleet-bitnet-all.json"
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "2"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 2Gi
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
      restartPolicy: Never
