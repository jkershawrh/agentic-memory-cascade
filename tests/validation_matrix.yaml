stages:
  stage_0_contracts:
    description: "All API contracts and data schemas are valid and parseable"
    threshold: 100
    criteria:
      openapi_spec_valid:
        description: "OpenAPI 3.1 spec parses without errors"
        points: 20
        required: true
      hardware_schema_valid:
        description: "Hardware profile JSON Schema validates"
        points: 15
        required: true
      workload_schema_valid:
        description: "Workload profile JSON Schema validates"
        points: 15
        required: true
      tco_result_schema_valid:
        description: "TCO result JSON Schema validates"
        points: 15
        required: true
      hardware_data_validates:
        description: "hardware_profiles.json validates against schema"
        points: 15
        required: true
      workload_data_validates:
        description: "workload_profiles.json validates against schema"
        points: 10
        required: true
      signal_distribution_sums:
        description: "All signal distributions sum to 100%"
        points: 10
        required: true

  stage_1_calculations:
    description: "TCO calculation engine produces correct results"
    threshold: 100
    criteria:
      signal_distribution_split:
        description: "Signals are correctly split across nano/micro/macro tiers"
        points: 15
        required: true
      nano_zero_cost:
        description: "Nano tier signals have zero inference cost"
        points: 15
        required: true
      hardware_count_rounds_up:
        description: "Hardware unit count always rounds up (can't buy half a server)"
        points: 10
        required: true
      power_cost_correct:
        description: "Annual power cost = units * watts * hours * cost_per_kwh"
        points: 10
        required: true
      cloud_api_cost_linear:
        description: "Cloud API cost scales linearly with token volume"
        points: 10
        required: true
      three_year_tco_sums:
        description: "3-year TCO = hardware + 3*(power + inference)"
        points: 10
        required: true
      idle_hardware_zeroes_capex:
        description: "Idle hardware mode sets hardware cost to 0"
        points: 10
        required: true
      compression_ratio_correct:
        description: "Compression ratio = inference_signals / total_signals"
        points: 10
        required: true
      edge_case_zero_volume:
        description: "Zero complex signals produces zero macro-agent cost"
        points: 10
        required: true

  stage_2_scenarios:
    description: "Business scenarios produce expected TCO orderings"
    threshold: 100
    criteria:
      high_volume_xeon_wins:
        description: "At high volume (>100K/day), Xeon 6 TCO < H100 TCO < Cloud API TCO"
        points: 20
        required: true
      low_volume_cloud_wins:
        description: "At low volume (<1000/day), cloud API has lowest 3-year TCO"
        points: 20
        required: true
      idle_hardware_lowest:
        description: "Idle hardware mode produces lowest possible Xeon TCO"
        points: 15
        required: true
      cascade_compression:
        description: "Signal compression reduces effective inference volume by >80%"
        points: 15
        required: true
      dispute_resolution_scenario:
        description: "Dispute resolution 500K/day produces valid TCO comparison"
        points: 15
        required: true
      fraud_triage_scenario:
        description: "Fraud triage 1M/day produces valid TCO comparison"
        points: 15
        required: true

  stage_memory_archive:
    description: "Memory archive stores, queries, and evicts survivors"
    threshold: 100
    criteria:
      memory_schema_valid:
        description: "memory-record.json validates as JSON Schema"
        points: 15
        required: true
      memory_store_roundtrip:
        description: "Stored memory retrievable by ID"
        points: 20
        required: true
      memory_capacity_bounded:
        description: "Archive never exceeds CASCADE_MEMORY_MAX"
        points: 20
        required: true
      memory_eviction_weakest:
        description: "Eviction removes lowest-strength memories"
        points: 15
        required: true
      memory_state_persistence:
        description: "to_dict -> from_dict roundtrip preserves archive"
        points: 15
        required: true
      memory_safety_invariant:
        description: "Memory features never weaken zero-FN guarantee"
        points: 15
        required: true

  stage_3_api:
    description: "API endpoints match OpenAPI contract"
    threshold: 100
    criteria:
      health_endpoint:
        description: "GET /health returns 200 with {status: healthy}"
        points: 20
        required: true
      hardware_endpoint:
        description: "GET /api/v1/hardware returns hardware profiles"
        points: 20
        required: true
      workloads_endpoint:
        description: "GET /api/v1/workloads returns workload profiles"
        points: 20
        required: true
      scenarios_endpoint:
        description: "GET /api/v1/scenarios returns FSI scenarios"
        points: 20
        required: true
      calculate_endpoint:
        description: "POST /api/v1/calculate returns valid TCO result"
        points: 20
        required: true
