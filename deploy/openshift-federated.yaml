  namespace: cascade-compression
  labels:
    app: cascade-memory
    component: aggregator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cascade-memory
  template:
    metadata:
      labels:
        app: cascade-memory
        component: aggregator
    spec:
      containers:
      - name: cascade
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        ports:
        - containerPort: 8090
        env:
        - name: CASCADE_DOMAIN
          value: "memory"
        - name: CASCADE_LLM_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
              optional: true
        - name: CASCADE_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
              optional: true
        - name: CASCADE_LLM_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_MICRO_MODEL
