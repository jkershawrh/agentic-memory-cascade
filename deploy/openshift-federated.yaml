spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cascade-aap
  template:
    metadata:
      labels:
        app: cascade-aap
        component: cascade
    spec:
      containers:
      - name: cascade
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        ports:
        - containerPort: 8090
        env:
        - name: CASCADE_DOMAIN
          value: "aap"
        - name: CASCADE_LLM_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
              optional: true
        - name: CASCADE_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
              optional: true
        - name: CASCADE_LLM_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_MICRO_MODEL
          value: "granite-2b-cpu"
        - name: CASCADE_MACRO_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_SHADOW_RATE
          value: "0.05"
        - name: CASCADE_ACTIVATION_TTL_HOURS
          value: "72"
        - name: CASCADE_MEMORY_ENABLED
          value: "1"
        - name: CASCADE_MEMORY_MAX
          value: "10000"
        - name: CASCADE_STATE_FILE
          value: "/state/cascade-aap.json"
        volumeMounts:
        - name: state
          mountPath: /state
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "4"
            memory: 6Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: cascade-aap-state

---
apiVersion: v1
kind: Service
metadata:
  name: cascade-aap
  namespace: cascade-compression
  labels:
    app: cascade-aap
spec:
  selector:
    app: cascade-aap
  ports:
  - port: 8090
    targetPort: 8090

