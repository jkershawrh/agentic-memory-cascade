---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cascade-memory
  namespace: cascade-compression
  labels:
    app: cascade-memory
spec:
  to:
    kind: Service
    name: cascade-memory
  port:
    targetPort: 8090
  tls:
    termination: edge

---
# ── Federation CronJob ──────────────────────────────────────────────
# Runs every 5 minutes: exports memories from K8s and AAP cascades,
# imports them into the memory aggregator, then runs consolidation.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cascade-federate
  namespace: cascade-compression
  labels:
    app: cascade-federate
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: cascade-federate
        spec:
          restartPolicy: OnFailure
          containers:
          - name: federate
            image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
            command:
            - python3
            - -c
            - |
              import json, urllib.request, sys
              from datetime import datetime, timezone, timedelta

              K8S = "http://cascade-k8s:8090"
              AAP = "http://cascade-aap:8090"
              KNOWLEDGE = "http://cascade-knowledge:8090"
              MEM = "http://cascade-memory:8090"

              def get(url):
                  try:
                      with urllib.request.urlopen(url, timeout=30) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      print(f"  GET {url}: {e}")
                      return None

              def post(url, data):
                  try:
                      payload = json.dumps(data).encode()
                      req = urllib.request.Request(url, data=payload, headers={"Content-Type": "application/json"}, method="POST")
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return json.loads(r.read())
                  except Exception as e:
                      print(f"  POST {url}: {e}")
                      return None

              since = (datetime.now(timezone.utc) - timedelta(minutes=6)).isoformat()

              print("=== Federation cycle ===")
              print(f"  Incremental since: {since}")

              for name, src in [("K8s", K8S), ("AAP", AAP), ("Knowledge", KNOWLEDGE)]:
                  exported = get(f"{src}/memories/export?min_strength=0.3&since={since}")
                  if not exported:
                      print(f"  {name}: export failed")
                      continue
                  count = len(exported.get("memories", []))
                  print(f"  {name}: {count} memories exported (incremental)")
                  if count > 0:
                      result = post(f"{MEM}/memories/import", exported)
                      print(f"  {name} imported: {result}")

              consol = post(f"{MEM}/consolidate", {})
              print(f"  Consolidation: {consol}")

              stats = get(f"{MEM}/memories/stats")
              if stats:
                  print(f"  Aggregator: size={stats.get('size',0)}, formed={stats.get('formed_total',0)}, sources={stats.get('federated_sources',0)}, rejected={stats.get('rejection_set_size',0)}, avg_strength={stats.get('avg_strength',0):.3f}")

              print("=== Federation complete ===")
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
