---
# Federated Cascade Deployment — infra01
#
# Three cascade instances:
#   1. cascade-k8s      — monitors Kubernetes clusters, forms K8s memories
#   2. cascade-aap      — monitors Ansible Automation Platform, forms AAP memories
#   3. cascade-memory   — aggregates memories from both, runs federated recall
#
# Each instance persists state to a PVC. The aggregator imports
# memories from K8s and AAP on a timer (CronJob) and runs
# consolidation + cross-source correlation.
#
# Usage:
#   oc apply -f deploy/openshift-federated.yaml
#   oc create secret generic cascade-llm \
#     --from-literal=url=https://your-llm/v1 \
#     --from-literal=key=sk-... \
#     -n cascade-compression
---
apiVersion: v1
kind: Namespace
metadata:
  name: cascade-compression

---
# Shared state volume for each cascade instance
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cascade-k8s-state
  namespace: cascade-compression
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cascade-aap-state
  namespace: cascade-compression
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cascade-memory-state
  namespace: cascade-compression
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 200Mi

---
# ── K8s Cascade ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascade-k8s
  namespace: cascade-compression
  labels:
    app: cascade-k8s
    component: cascade
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cascade-k8s
  template:
    metadata:
      labels:
        app: cascade-k8s
        component: cascade
    spec:
      containers:
      - name: cascade
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        ports:
        - containerPort: 8090
        env:
        - name: CASCADE_DOMAIN
          value: "kubernetes"
        - name: CASCADE_LLM_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
              optional: true
        - name: CASCADE_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
              optional: true
        - name: CASCADE_LLM_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_MICRO_MODEL
          value: "granite-2b-cpu"
        - name: CASCADE_MACRO_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_LLM_THREADS
          value: "5"
        - name: CASCADE_LLM_BATCH
          value: "700"
        - name: CASCADE_LLM_WORKERS
          value: "8"
        - name: CASCADE_LLM_BUFFER
          value: "10000"
        - name: CASCADE_SHADOW_RATE
          value: "0.05"
        - name: CASCADE_ACTIVATION_TTL_HOURS
          value: "72"
        - name: CASCADE_MEMORY_ENABLED
          value: "1"
        - name: CASCADE_MEMORY_MAX
          value: "10000"
        - name: CASCADE_STATE_FILE
          value: "/state/cascade-k8s.json"
        - name: CASCADE_GPU_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
              optional: true
        - name: CASCADE_GPU_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
              optional: true
        - name: CASCADE_GPU_MODEL
          value: "microsoft-phi-4"
        - name: CASCADE_GPU_ANALYSES_FILE
          value: "/state/gpu-analyses.jsonl"
        volumeMounts:
        - name: state
          mountPath: /state
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: cascade-k8s-state

---
apiVersion: v1
kind: Service
metadata:
  name: cascade-k8s
  namespace: cascade-compression
  labels:
    app: cascade-k8s
spec:
  selector:
    app: cascade-k8s
  ports:
  - port: 8090
    targetPort: 8090

---
