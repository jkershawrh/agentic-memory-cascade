---
# Signal collectors — generic infrastructure + knowledge domain
#
# K8s collector: polls OCP clusters
# AAP collector: polls AAP database
# Jira/Git/Confluence: organizational knowledge domain

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: collector-k8s
    component: collector
  name: collector-k8s
  namespace: cascade-compression
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector-k8s
  template:
    metadata:
      labels:
        app: collector-k8s
        component: collector
    spec:
      containers:
      - command:
        - python3
        - -m
        - cascade_compression.collector_sidecar
        - --mode=k8s
        - --target=http://cascade-k8s:8090
        - --interval=30
        envFrom:
        - secretRef:
            name: collector-clusters
        image: image-registry.openshift-image-registry.svc:5000/cascade-compression/cascade-compression:latest
        name: collector
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
