---
apiVersion: v1
kind: Namespace
metadata:
  name: cascade-compression
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascade-compression
  namespace: cascade-compression
  labels:
    app: cascade-compression
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cascade-compression
  template:
    metadata:
      labels:
        app: cascade-compression
    spec:
      containers:
      - name: cascade
        image: quay.io/redhat-ai-incubation/cascade-compression:latest
        ports:
        - containerPort: 8090
        env:
        - name: CASCADE_DOMAIN
          value: "kubernetes"
        - name: CASCADE_LLM_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
              optional: true
        - name: CASCADE_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
              optional: true
        - name: CASCADE_LLM_MODEL
          value: "granite-3-2-8b-instruct"
        - name: CASCADE_SHADOW_RATE
          value: "0.05"
        - name: CASCADE_ACTIVATION_TTL_HOURS
          value: "72"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 4Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cascade-compression
  namespace: cascade-compression
  labels:
    app: cascade-compression
spec:
  selector:
    app: cascade-compression
  ports:
  - port: 8090
    targetPort: 8090
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: cascade-compression
  namespace: cascade-compression
  labels:
    app: cascade-compression
spec:
  to:
    kind: Service
    name: cascade-compression
  port:
    targetPort: 8090
  tls:
    termination: edge
