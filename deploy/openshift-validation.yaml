---
# Cascade Validation — Multi-domain synthetic testing on Oberon
# Three cascade instances: finance, healthcare, telecom
# All pointing at granite-2b-cpu via cross-namespace service
---
apiVersion: v1
kind: Secret
metadata:
  name: cascade-llm
  namespace: cascade-validation
type: Opaque
stringData:
  url: "http://ovms-granite-2b.fleet-llm-d.svc:8080/v1"
  key: "not-needed"
---
# ── Finance (FSI) ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cascade-finance
  namespace: cascade-validation
  labels:
    app: cascade-finance
    domain: finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cascade-finance
  template:
    metadata:
      labels:
        app: cascade-finance
        domain: finance
    spec:
      containers:
      - name: cascade
        image: image-registry.openshift-image-registry.svc:5000/cascade-validation/cascade-compression:latest
        ports:
        - containerPort: 8090
        env:
        - name: CASCADE_DOMAIN
          value: "finance"
        - name: CASCADE_LLM_URL
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: url
        - name: CASCADE_LLM_KEY
          valueFrom:
            secretKeyRef:
              name: cascade-llm
              key: key
        - name: CASCADE_LLM_MODEL
          value: "granite-2b-cpu"
        - name: CASCADE_SHADOW_RATE
          value: "0.05"
        - name: CASCADE_ACTIVATION_TTL_HOURS
          value: "72"
        - name: CASCADE_MEMORY_MAX
          value: "10000"
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: cascade-finance
  namespace: cascade-validation
  labels:
    app: cascade-finance
spec:
  selector:
    app: cascade-finance
  ports:
  - port: 8090
    targetPort: 8090
---
