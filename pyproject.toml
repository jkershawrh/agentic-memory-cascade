[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-memory-cascade"
version = "0.1.0"
description = "Cross-session agent memory proof built on Cascade Compression"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = [
    "cascade-compression @ https://github.com/jkershawrh/cascade-compression/archive/ba5d53d654f2dc9792672163e934616f53b831c7.tar.gz",
    "pydantic>=2.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn[standard]>=0.22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-asyncio",
    "jsonschema>=4.0",
]
[project.scripts]
agentic-memory-proof = "agentic_memory_cascade.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_memory_cascade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
