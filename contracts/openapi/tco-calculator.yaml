openapi: "3.1.0"
info:
  title: Intel TCO Calculator API
  version: "1.0.0"
  description: >
    Total Cost of Ownership calculator comparing Intel Xeon 6 CPUs,
    NVIDIA H100 GPUs, and cloud API token pricing for AI inference workloads.
    Built for Intel FSI (Financial Services) sales conversations.
  contact:
    name: Intel FSI Engineering
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:8090
    description: Local development

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum: [healthy]

  /api/v1/hardware:
    get:
      operationId: listHardware
      summary: List available hardware profiles
      responses:
        "200":
          description: Hardware profiles
          content:
            application/json:
              schema:
                type: object
                required:
                  - profiles
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/HardwareProfile"

  /api/v1/workloads:
    get:
      operationId: listWorkloads
      summary: List pre-built workload profiles
      responses:
        "200":
          description: Workload profiles
          content:
            application/json:
              schema:
                type: object
                required:
                  - profiles
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkloadProfile"

  /api/v1/scenarios:
    get:
      operationId: listScenarios
      summary: List pre-built FSI scenarios
      responses:
        "200":
          description: FSI scenarios
          content:
            application/json:
              schema:
                type: object
                required:
                  - scenarios
                properties:
                  scenarios:
                    type: array
                    items:
                      $ref: "#/components/schemas/Scenario"

  /api/v1/calculate:
    post:
      operationId: calculateTCO
      summary: Calculate full TCO comparison for a workload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateRequest"
      responses:
        "200":
          description: TCO comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TCOResult"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

components:
  schemas:
    HardwareProfile:
      type: object
      required:
        - id
        - name
        - type
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [cpu, gpu, cloud_api]
        cost_per_unit_usd:
          type: number
          minimum: 0
        power_watts:
          type: number
          minimum: 0
        amx_support:
          type: boolean
        cost_per_1k_input_tokens:
          type: number
          minimum: 0
        cost_per_1k_output_tokens:
          type: number
          minimum: 0
        rate_limit_rpm:
          type: integer
          minimum: 0
        inference_throughput:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ThroughputSpec"

    ThroughputSpec:
      type: object
      required:
        - tokens_per_second
        - classification_rps
      properties:
        tokens_per_second:
          type: number
          minimum: 0
        classification_rps:
          type: number
          minimum: 0

    WorkloadProfile:
      type: object
      required:
        - id
        - name
        - description
        - daily_volume
        - signal_distribution
        - tokens_per_signal
        - latency_requirement_ms
        - model_by_tier
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        daily_volume:
          type: integer
          minimum: 1
        signal_distribution:
          $ref: "#/components/schemas/SignalDistribution"
        tokens_per_signal:
          $ref: "#/components/schemas/TokensPerSignal"
        latency_requirement_ms:
          type: integer
          minimum: 1
        model_by_tier:
          $ref: "#/components/schemas/ModelByTier"

    SignalDistribution:
      type: object
      required:
        - routine_pct
        - ambiguous_pct
        - complex_pct
      properties:
        routine_pct:
          type: number
          minimum: 0
          maximum: 100
        ambiguous_pct:
          type: number
          minimum: 0
          maximum: 100
        complex_pct:
          type: number
          minimum: 0
          maximum: 100

    TokensPerSignal:
      type: object
      required:
        - input
        - output
      properties:
        input:
          type: integer
          minimum: 1
        output:
          type: integer
          minimum: 1

    ModelByTier:
      type: object
      required:
        - nano
        - micro
        - macro
      properties:
        nano:
          type: ["string", "null"]
        micro:
          type: string
        macro:
          type: string

    Scenario:
      type: object
      required:
        - id
        - name
        - description
        - workload_id
        - assumptions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        workload_id:
          type: string
        assumptions:
          $ref: "#/components/schemas/Assumptions"

    Assumptions:
      type: object
      properties:
        power_cost_per_kwh:
          type: number
          minimum: 0
        hours_per_year:
          type: integer
          minimum: 0
        tco_years:
          type: integer
          minimum: 1
        idle_hardware:
          type: boolean

    CalculateRequest:
      type: object
      required:
        - workload
      properties:
        workload:
          $ref: "#/components/schemas/WorkloadProfile"
        assumptions:
          $ref: "#/components/schemas/Assumptions"

    TCOResult:
      type: object
      required:
        - workload_id
        - workload_name
        - daily_volume
        - cascade_summary
        - comparisons
      properties:
        workload_id:
          type: string
        workload_name:
          type: string
        daily_volume:
          type: integer
        cascade_summary:
          $ref: "#/components/schemas/CascadeSummary"
        comparisons:
          type: array
          items:
            $ref: "#/components/schemas/HardwareComparison"
        unsupported_options:
          type: array
          items:
            $ref: "#/components/schemas/UnsupportedHardwareOption"

    CascadeSummary:
      type: object
      required:
        - total_signals_per_day
        - nano_signals_per_day
        - micro_signals_per_day
        - macro_signals_per_day
        - inference_signals_per_day
        - compression_ratio
      properties:
        total_signals_per_day:
          type: integer
        nano_signals_per_day:
          type: integer
        micro_signals_per_day:
          type: integer
        macro_signals_per_day:
          type: integer
        inference_signals_per_day:
          type: integer
        compression_ratio:
          type: number

    HardwareComparison:
      type: object
      required:
        - hardware_id
        - hardware_name
        - hardware_type
        - units_required
        - hardware_cost_usd
        - annual_power_cost_usd
        - annual_inference_cost_usd
        - three_year_tco_usd
        - cost_per_signal_usd
      properties:
        hardware_id:
          type: string
        hardware_name:
          type: string
        hardware_type:
          type: string
        units_required:
          type: integer
          minimum: 0
        hardware_cost_usd:
          type: number
          minimum: 0
        annual_power_cost_usd:
          type: number
          minimum: 0
        annual_inference_cost_usd:
          type: number
          minimum: 0
        three_year_tco_usd:
          type: number
          minimum: 0
        cost_per_signal_usd:
          type: number
          minimum: 0
        idle_hardware_tco_usd:
          type: number
          minimum: 0
        notes:
          type: array
          items:
            type: string

    UnsupportedHardwareOption:
      type: object
      required:
        - hardware_id
        - hardware_name
        - reason
      properties:
        hardware_id:
          type: string
        hardware_name:
          type: string
        reason:
          type: string

    ValidationError:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            type: object
            properties:
              loc:
                type: array
                items:
                  type: string
              msg:
                type: string
              type:
                type: string
