<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Red Hat Text, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-end">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#6A6E73"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-end">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#C9190B"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-end">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#3E8635"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#151515"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="Red Hat Display, sans-serif" font-size="18" font-weight="600" fill="#fff">Cascade Compression — Architecture</text>
  <line x1="50" y1="48" x2="850" y2="48" stroke="#EE0000" stroke-width="2"/>

  <!-- Signal source -->
  <rect x="30" y="70" width="140" height="60" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
  <text x="100" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#e0e0e0">Signal source</text>
  <text x="100" y="114" text-anchor="middle" font-size="11" fill="#6A6E73">K8s, AAP, IoT, FSI</text>

  <!-- Arrow: source to nano -->
  <line x1="170" y1="100" x2="205" y2="100" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- NANO TIER -->
  <rect x="210" y="62" width="220" height="78" rx="8" fill="#1a1a1a" stroke="#3E8635" stroke-width="1.5"/>
  <text x="320" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#3E8635">NANO TIER (95-99%)</text>
  <text x="320" y="98" text-anchor="middle" font-size="11" fill="#b0b0b0">Dedup · Severity gate · Transient</text>
  <text x="320" y="112" text-anchor="middle" font-size="11" fill="#b0b0b0">Pattern match · Learned agents</text>
  <text x="320" y="128" text-anchor="middle" font-size="10" fill="#6A6E73">microseconds · zero cost</text>

  <!-- Arrow: nano to micro -->
  <line x1="430" y1="100" x2="465" y2="100" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="448" y="92" text-anchor="middle" font-size="10" fill="#6A6E73">1-5%</text>

  <!-- MICRO TIER -->
  <rect x="470" y="70" width="180" height="60" rx="8" fill="#1a1a1a" stroke="#4394E5" stroke-width="1.5"/>
  <text x="560" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#4394E5">MICRO TIER</text>
  <text x="560" y="108" text-anchor="middle" font-size="11" fill="#b0b0b0">LLM classifies survivors</text>
  <text x="560" y="122" text-anchor="middle" font-size="10" fill="#6A6E73">~600ms · CPU model</text>

  <!-- Arrow: micro to output -->
  <line x1="650" y1="100" x2="685" y2="100" stroke="#6A6E73" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="668" y="92" text-anchor="middle" font-size="10" fill="#6A6E73">&lt;1%</text>

  <!-- Output -->
  <rect x="690" y="70" width="170" height="60" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
  <text x="775" y="96" text-anchor="middle" font-size="13" font-weight="500" fill="#e0e0e0">Alerts / Actions</text>
  <text x="775" y="114" text-anchor="middle" font-size="11" fill="#6A6E73">Real signals only</text>

  <!-- SELF-TUNING FLYWHEEL -->
  <rect x="210" y="170" width="440" height="105" rx="8" fill="#1a1a1a" stroke="#F0AB00" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="430" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#F0AB00">SELF-TUNING FLYWHEEL</text>

  <!-- Flywheel steps -->
  <rect x="225" y="200" width="95" height="36" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="272" y="215" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">Discover</text>
  <text x="272" y="228" text-anchor="middle" font-size="9" fill="#6A6E73">corpus analyzer</text>

  <line x1="320" y1="218" x2="340" y2="218" stroke="#6A6E73" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="345" y="200" width="80" height="36" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="385" y="215" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">Validate</text>
  <text x="385" y="228" text-anchor="middle" font-size="9" fill="#6A6E73">LLM confirms</text>

  <line x1="425" y1="218" x2="445" y2="218" stroke="#6A6E73" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="450" y="200" width="80" height="36" rx="6" fill="#252525" stroke="#3E8635"/>
  <text x="490" y="215" text-anchor="middle" font-size="10" font-weight="500" fill="#3E8635">Promote</text>
  <text x="490" y="228" text-anchor="middle" font-size="9" fill="#6A6E73">zero-FN gate</text>

  <line x1="530" y1="218" x2="550" y2="218" stroke="#6A6E73" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="555" y="200" width="80" height="36" rx="6" fill="#252525" stroke="#3E8635"/>
  <text x="595" y="215" text-anchor="middle" font-size="10" font-weight="500" fill="#3E8635">Activate</text>
  <text x="595" y="228" text-anchor="middle" font-size="9" fill="#6A6E73">agent runs</text>

  <!-- Feedback arrow from LLM back to flywheel -->
  <path d="M 560 130 L 560 155 L 430 155 L 430 170" fill="none" stroke="#F0AB00" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <text x="490" y="152" text-anchor="middle" font-size="9" fill="#F0AB00">LLM feedback</text>

  <!-- Arrow from flywheel up to nano -->
  <path d="M 320 200 L 320 165 L 320 140" fill="none" stroke="#3E8635" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="295" y="160" text-anchor="end" font-size="9" fill="#3E8635">agents activate</text>

  <!-- Promotion ladder -->
  <text x="305" y="258" text-anchor="middle" font-size="9" fill="#6A6E73">draft → candidate → [pending_approval] → nano → micro → macro</text>

  <!-- DEFENSE IN DEPTH -->
  <rect x="30" y="295" width="840" height="100" rx="8" fill="#1a1a1a" stroke="#EE0000" stroke-width="1.5"/>
  <text x="450" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#EE0000">DEFENSE IN DEPTH</text>

  <!-- Five defense tiles -->
  <rect x="48" y="330" width="142" height="50" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="119" y="348" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">Zero-FN gate</text>
  <text x="119" y="362" text-anchor="middle" font-size="9" fill="#3E8635">0.0% tolerance</text>
  <text x="119" y="374" text-anchor="middle" font-size="8" fill="#6A6E73">at promotion</text>

  <rect x="200" y="330" width="142" height="50" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="271" y="348" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">Shadow validation</text>
  <text x="271" y="362" text-anchor="middle" font-size="9" fill="#4394E5">5% re-check by LLM</text>
  <text x="271" y="374" text-anchor="middle" font-size="8" fill="#6A6E73">continuous</text>

  <rect x="352" y="330" width="142" height="50" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="423" y="348" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">GCL audit</text>
  <text x="423" y="362" text-anchor="middle" font-size="9" fill="#4394E5">1% independent audit</text>
  <text x="423" y="374" text-anchor="middle" font-size="8" fill="#6A6E73">immutable ledger</text>

  <rect x="504" y="330" width="142" height="50" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="575" y="348" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">72h TTL</text>
  <text x="575" y="362" text-anchor="middle" font-size="9" fill="#F0AB00">agents expire</text>
  <text x="575" y="374" text-anchor="middle" font-size="8" fill="#6A6E73">must re-qualify</text>

  <rect x="656" y="330" width="142" height="50" rx="6" fill="#252525" stroke="#2e2e2e"/>
  <text x="727" y="348" text-anchor="middle" font-size="10" font-weight="500" fill="#e0e0e0">Human gate</text>
  <text x="727" y="362" text-anchor="middle" font-size="9" fill="#6A6E73">optional approval</text>
  <text x="727" y="374" text-anchor="middle" font-size="8" fill="#6A6E73">for regulated envs</text>

  <!-- Demotion arrow -->
  <path d="M 450 395 L 450 420 L 100 420 L 100 130" fill="none" stroke="#C9190B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="280" y="435" text-anchor="middle" font-size="10" font-weight="500" fill="#C9190B">ANY failure → instant demotion to draft, samples zeroed, evidence to ledger</text>

  <!-- Domain packs -->
  <rect x="30" y="460" width="840" height="45" rx="8" fill="#1a1a1a" stroke="#2e2e2e"/>
  <text x="450" y="480" text-anchor="middle" font-size="11" font-weight="500" fill="#e0e0e0">8 domain packs: Kubernetes · AAP · Financial Services · Healthcare · Insurance · Retail · Telecom · Memory</text>
  <text x="450" y="496" text-anchor="middle" font-size="10" fill="#6A6E73">Same engine. Different prompts. Zero code changes.</text>
</svg>
